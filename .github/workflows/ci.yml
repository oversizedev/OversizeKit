name: CI

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
  
jobs:
  build-oversize-kit:
    name: Build OversizeKit
    uses: oversizedev/GithubWorkflows/.github/workflows/build-swiftpm-all-platforms.yml@main
    with:
      package: OversizeKit
    secrets: inherit
    
  build-calendar-kit:
    name: Build CalendarKit
    uses: oversizedev/GithubWorkflows/.github/workflows/build-swiftpm-all-platforms.yml@main
    with:
      package: OversizeCalendarKit
    secrets: inherit
    
  build-contacts-kit:
    name: Build OversizeContactsKit
    uses: oversizedev/GithubWorkflows/.github/workflows/build-swiftpm-all-platforms.yml@main
    with:
      package: OversizeContactsKit
    secrets: inherit
    
  build-location-kit:
    name: Build LocationKit
    uses: oversizedev/GithubWorkflows/.github/workflows/build-swiftpm-all-platforms.yml@main
    with:
      package: OversizeLocationKit
    secrets: inherit
    
  build-notice-kit:
    name: Build NoticeKit
    uses: oversizedev/GithubWorkflows/.github/workflows/build-swiftpm-all-platforms.yml@main
    with:
      package: OversizeNoticeKit
    secrets: inherit
    
  build-notification-kit:
    name: Build NotificationKit
    uses: oversizedev/GithubWorkflows/.github/workflows/build-swiftpm-all-platforms.yml@main
    with:
      package: OversizeNotificationKit
    secrets: inherit
    
  build-onboarding-kit:
    name: Build OnboardingKit
    uses: oversizedev/GithubWorkflows/.github/workflows/build-swiftpm-all-platforms.yml@main
    with:
      package: OversizeOnboardingKit
    secrets: inherit
    
  build-media-kit:
    name: Build MediaKit
    uses: oversizedev/GithubWorkflows/.github/workflows/build-swiftpm-all-platforms.yml@main
    with:
      package: OversizeMediaKit
    secrets: inherit
    
  # OversizeEditorKit is iOS/macOS only: it builds on TextEditor and Menu,
  # which are unavailable on tvOS and watchOS.
  build-editor-kit-ios:
    name: Build EditorKit (iOS)
    uses: oversizedev/GithubWorkflows/.github/workflows/build-swiftpm.yml@main
    with:
      package: OversizeEditorKit
      destination: generic/platform=iOS Simulator
    secrets: inherit

  build-editor-kit-macos:
    name: Build EditorKit (macOS)
    uses: oversizedev/GithubWorkflows/.github/workflows/build-swiftpm.yml@main
    with:
      package: OversizeEditorKit
      destination: platform=macOS
    secrets: inherit

  build-example:
    name: Build Example
    needs:
      - build-oversize-kit
      - build-calendar-kit
      - build-contacts-kit
      - build-location-kit
      - build-notice-kit
      - build-notification-kit
      - build-onboarding-kit
      - build-media-kit
      - build-editor-kit-ios
      - build-editor-kit-macos
    uses: oversizedev/GithubWorkflows/.github/workflows/build-app.yml@main
    with:
      path: AppExample/Example
      scheme: Example
      destination: generic/platform=iOS Simulator
    secrets: inherit

  tests:
    name: Package tests
    needs:
      - build-oversize-kit
    runs-on: xcode-27
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup SwiftPM Config
        run: |
          echo "machine github.com login oversizedev password ${{ secrets.ACTIONS_TOKEN }}" > ~/.netrc
          chmod 600 ~/.netrc
          set -euo pipefail
          defaults write com.apple.dt.Xcode IDESkipPackagePluginFingerprintValidation -bool YES
          defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES

      - name: Select the newest available iPhone simulator
        id: simulator
        run: |
          set -eo pipefail
          udid=$(xcrun simctl list devices available --json | jq -r '
            .devices
            | to_entries
            | map(select(.key | test("com.apple.CoreSimulator.SimRuntime.iOS")))
            | sort_by(.key)
            | reverse
            | map(.value | map(select(.name | test("iPhone"))))
            | flatten
            | .[0].udid // empty
          ')
          if [ -z "$udid" ]; then
            echo "No iPhone simulator available on this runner" >&2
            xcrun simctl list devices available >&2
            exit 1
          fi
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Run tests
        run: |
          xcodebuild test \
            -skipPackagePluginValidation \
            -scheme OversizeKit-Package \
            -destination "id=${{ steps.simulator.outputs.udid }}" | xcpretty && exit ${PIPESTATUS[0]}

  # The ExampleUITests target builds and its runner launches, but the app under
  # automation renders an empty accessibility tree, so the tests do not pass yet.
  # Re-enable this job once that is resolved.
#  ui-tests:
#    name: Example UI tests
#    needs:
#      - build-example
#    runs-on: macos-latest
#    steps:
#      - name: Checkout
#        uses: actions/checkout@v7

#      - name: Setup SwiftPM Config
#        run: |
#          echo "machine github.com login oversizedev password ${{ secrets.ACTIONS_TOKEN }}" > ~/.netrc
#          chmod 600 ~/.netrc
#          set -euo pipefail
#          defaults write com.apple.dt.Xcode IDESkipPackagePluginFingerprintValidation -bool YES
#          defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES

#      - name: Run UI tests
#        run: |
#          xcodebuild test \
#            -skipPackagePluginValidation \
#            -project AppExample/Example.xcodeproj \
#            -scheme Example \
#            -destination "platform=iOS Simulator,name=iPhone 17 Pro" \
#            -only-testing:ExampleUITests | xcpretty && exit ${PIPESTATUS[0]}

  bump:
    name: Bump version
    needs:
      - build-example
      - tests
    if: github.ref == 'refs/heads/main'
    uses: oversizedev/GithubWorkflows/.github/workflows/bump.yml@main
    secrets: inherit
